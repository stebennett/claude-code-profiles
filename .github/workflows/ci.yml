name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      # The unit suite needs no `claude` on PATH, no credentials and no
      # network. The real-`claude` integration test is deliberately excluded.
      - run: npm test

      - run: npm run build

      # Packs the package and installs it globally into a prefix of its own,
      # then runs the installed binary. This matrix is what makes "installs
      # and runs on macOS and Linux" a fact rather than a claim, so unlike the
      # real-`claude` suite it belongs here.
      - run: npm run test:package
